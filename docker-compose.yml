x-airflow-common:
  &airflow-common
  build: ./airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@airflow-postgres/${AIRFLOW_DB_NAME:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    POSTGRES_HOST: postgres
    POSTGRES_DB: fuzzyfactory
    POSTGRES_USER: analyst
    POSTGRES_PASSWORD: analyst
    DBT_PROFILES_DIR: /opt/airflow/dbt_project
    DBT_LOG_PATH: /opt/airflow/logs/dbt
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/scripts:/opt/airflow/scripts
    - ./dbt_project:/opt/airflow/dbt_project
    - ./warehouse:/opt/airflow/warehouse
    - airflow_logs:/opt/airflow/logs
  depends_on:
    &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fuzzyfactory
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/raw_csv:/data:ro
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d fuzzyfactory"]
      interval: 5s
      retries: 10

  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER:-airflow}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USERNAME" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_USERNAME}@fuzzyfactory.local" || true
        airflow pools set duckdb_writer 1 \
          "DuckDB khong ho tro nhieu tien trinh ghi cung luc - moi task cham vao warehouse.duckdb phai xep hang qua pool nay" || true
    environment:
      <<: *airflow-common-env
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  dbt-docs:
    build: ./airflow
    depends_on:
      - airflow-webserver
    environment:
      DBT_PROFILES_DIR: /opt/airflow/dbt_project
      DBT_LOG_PATH: /tmp/dbt-logs
    volumes:
      - ./dbt_project:/opt/airflow/dbt_project
      - ./warehouse:/opt/airflow/warehouse
    ports:
      - "8081:8080"
    entrypoint: ["/bin/bash", "-c"]
    command: ["dbt docs serve --project-dir /opt/airflow/dbt_project --port 8080 --host 0.0.0.0"]

volumes:
  pgdata:
  airflow_pgdata:
  airflow_logs:
